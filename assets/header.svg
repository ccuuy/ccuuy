<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Dante — AI agents and inference infrastructure</title>
  <desc id="desc">A dark technical banner with a model, agent, and tools execution diagram.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1120"/>
      <stop offset="1" stop-color="#15243a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#2dd4bf" stop-opacity=".13"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".065"/>
    </pattern>
    <clipPath id="bounds"><rect width="1120" height="360" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1120" height="360" fill="url(#background)"/>
    <rect width="1120" height="360" fill="url(#grid)"/>
    <ellipse cx="920" cy="180" rx="340" ry="280" fill="url(#glow)"/>
    <path d="M624 360 832 0M720 360 928 0M816 360 1024 0" stroke="#7dd3fc" stroke-opacity=".035"/>
    <rect x=".5" y=".5" width="1119" height="359" rx="21.5" fill="none" stroke="#334155" stroke-opacity=".65"/>

    <rect x="48" y="38" width="152" height="29" rx="14.5" fill="#0c1725" stroke="#334155"/>
    <circle cx="66" cy="52.5" r="3.5" fill="#5eead4"/>
    <text x="79" y="57" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1.1">CCUUY / DANTE</text>

    <text x="46" y="151" fill="#f1f5f9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="70" font-weight="750" letter-spacing="-3">AI agents.</text>
    <text x="46" y="231" fill="url(#accent)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="70" font-weight="750" letter-spacing="-3">Inference infra.</text>
    <text x="50" y="278" fill="#a9bad0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Reliable tool use. Predictable execution.</text>
    <path d="M50 310H94" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <text x="108" y="314" fill="#758ba5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1.7">SOFTWARE / OPEN SOURCE</text>

    <g transform="translate(714 43)">
      <rect width="358" height="274" rx="14" fill="#0b1320" stroke="#314157"/>
      <path d="M0 39H358" stroke="#253449"/>
      <circle cx="19" cy="20" r="4" fill="#3a5267"/>
      <circle cx="33" cy="20" r="4" fill="#3a5267"/>
      <circle cx="47" cy="20" r="4" fill="#3a5267"/>
      <text x="74" y="24" fill="#91a7bf" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">runtime.trace</text>
      <text x="302" y="24" fill="#5eead4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10">/ 01</text>

      <path d="M43 91V207" fill="none" stroke="#2b5d68" stroke-width="2"/>
      <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
        <rect x="24" y="62" width="310" height="46" rx="8" fill="#111e2e" stroke="#2d455d"/>
        <text x="36" y="90" fill="#7dd3fc" font-size="13">01</text>
        <text x="77" y="90" fill="#e2e8f0" font-size="14">model</text>
        <text x="201" y="90" fill="#819ab4" font-size="11">inference</text>
        <rect x="24" y="123" width="310" height="46" rx="8" fill="#10232c" stroke="#2e807d"/>
        <text x="36" y="151" fill="#5eead4" font-size="13">02</text>
        <text x="77" y="151" fill="#e2e8f0" font-size="14">agent</text>
        <text x="201" y="151" fill="#8fbbb8" font-size="11">context / plan</text>
        <rect x="24" y="184" width="310" height="46" rx="8" fill="#111e2e" stroke="#2d455d"/>
        <text x="36" y="212" fill="#7dd3fc" font-size="13">03</text>
        <text x="77" y="212" fill="#e2e8f0" font-size="14">tools</text>
        <text x="201" y="212" fill="#819ab4" font-size="11">execution</text>
      </g>
      <circle cx="30" cy="251" r="3" fill="#5eead4"/>
      <text x="43" y="255" fill="#8aa4bb" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1">REPRODUCE / FIX / VERIFY</text>
    </g>
  </g>
</svg>
